# Gera o APK do maria open CHESS (Android)
name: Gerar APK do Android
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar a pasta do projeto
        run: |
          Z=$(ls ./*android-studio-projeto*.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then
            echo "Extraindo $Z"
            mkdir -p _projeto && unzip -q -o "$Z" -d _projeto
          fi
          P=$(find . -path '*/android/scripts/prepare.js' -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then
            echo "ERRO: nao encontrei o projeto. Envie o arquivo maria-open-chess-0.1.0-android-studio-projeto.zip para a raiz do repositorio. Arquivos encontrados:"
            find . -maxdepth 3 -not -path './.git*' | head -60
            exit 1
          fi
          ROOT=$(cd "$(dirname "$P")/../.." && pwd)
          echo "Projeto em: $ROOT"
          ls "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (licencas e componentes)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Testes do código JavaScript
        working-directory: ${{ env.ROOT }}
        run: npm test
      - name: Baixar libnode e sql.js
        working-directory: ${{ env.ROOT }}
        run: node android/scripts/prepare.js
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar o APK (debug)
        working-directory: ${{ env.ROOT }}/android
        run: ./gradlew assembleDebug --stacktrace
      - name: Copiar o APK
        run: mkdir -p apk-saida && cp "$ROOT/android/app/build/outputs/apk/debug/app-debug.apk" apk-saida/
      - uses: actions/upload-artifact@v4
        with:
          name: maria-open-chess-apk
          path: apk-saida/app-debug.apk
